name: Deploy ML Service to EC2

on:
  push:
    branches: [ main, before-image-processing-model, setting-up-an-EC2-Instance, ml-service-deploy ]
    paths:
      - 'ml-service/**'
  pull_request:
    branches: [ main, before-image-processing-model, setting-up-an-EC2-Instance, ml-service-deploy ]
    paths:
      - 'ml-service/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./ml-service
        push: true
        tags: sandaru71/velociroute-ml-service:latest
        no-cache: true

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Create directories if they don't exist
          mkdir -p ~/velociroute/ml-service/deploy
          
          # Create Docker network if it doesn't exist
          docker network create velociroute-network || true
          
          # Create docker-compose.yml for ML service
          cat > ~/velociroute/ml-service/deploy/docker-compose.yml << 'EOL'
          version: "3.8"

          services:
            ml-service:
              image: sandaru71/velociroute-ml-service:latest
              container_name: velociroute-ml-service
              ports:
                - "8000:8000"
              environment:
                - MODEL_DEVICE=cpu
                - BATCH_SIZE=1
                - HOST=0.0.0.0
                - PORT=8000
              restart: unless-stopped
              deploy:
                resources:
                  limits:
                    cpus: '1'
                    memory: 2G
              networks:
                - velociroute-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
                interval: 30s
                timeout: 10s
                retries: 3

          networks:
            velociroute-network:
              external: true
          EOL

          # Stop and remove existing containers if any
          echo "Stopping existing containers..."
          docker-compose -f ~/velociroute/ml-service/deploy/docker-compose.yml down || true
          
          # Pull and start the ML service
          cd ~/velociroute/ml-service/deploy
          echo "Pulling latest image..."
          docker-compose pull
          echo "Starting service..."
          docker-compose up -d

          # Show initial container status
          echo "Initial container status:"
          docker ps -a | grep ml-service
          
          # Wait for service to be healthy
          echo "Waiting for ML service to be healthy..."
          for i in {1..30}; do
            echo "Attempt $i/30: Checking container logs..."
            docker-compose logs ml-service
            
            echo "Attempt $i/30: Checking container status..."
            docker ps -a | grep ml-service
            
            if curl -f http://localhost:8000/health; then
              echo "ML service is healthy"
              exit 0
            fi
            echo "Waiting for ML service to be ready... attempt $i/30"
            sleep 10
          done
          
          # If we get here, show final debugging information
          echo "ML service failed to become healthy. Final debugging information:"
          echo "1. Container status:"
          docker ps -a | grep ml-service
          echo "2. Container logs:"
          docker-compose logs ml-service
          echo "3. Resource usage:"
          docker stats ml-service --no-stream
          exit 1
